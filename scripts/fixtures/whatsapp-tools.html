<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font:
          16px 'Segoe UI',
          sans-serif;
        background: #0b141a;
        color: #e9edef;
      }
      #app {
        height: 100%;
        display: flex;
      }
      #side {
        width: 220px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #111b21;
        border-right: 1px solid #29363c;
        padding: 8px;
      }
      #pane-side {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .fixture-chat {
        border-left: 5px solid transparent;
        height: 72px;
        padding: 14px 4px;
        border-bottom: 1px solid #29363c;
        cursor: pointer;
      }
      .fixture-title {
        overflow: hidden;
        height: 22px;
        display: flex;
        align-items: center;
      }
      .fixture-preview {
        margin-top: 10px;
        height: 18px;
        font-size: 12px;
        color: #9baab3;
      }
      .fixture-chat input[type='text'] {
        text-indent: 30px;
        font: 16px/25px sans-serif;
      }
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px;
        background: #202c33;
      }
      #messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 25px;
      }
      .message-in,
      .message-out {
        background: #202c33;
        padding: 14px;
        max-width: 90%;
        border-radius: 9px;
        margin: 15px 0;
      }
      footer {
        padding: 18px;
        display: flex;
        gap: 12px;
        background: #202c33;
      }
      [contenteditable] {
        min-height: 44px;
        padding: 12px;
        background: #2a3942;
        border-radius: 8px;
        flex: 1;
        white-space: pre-wrap;
      }
      button {
        background: #00a884;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 12px;
      }
      small {
        display: block;
        color: #91a2ac;
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side">
        <header>
          <strong>本地模拟</strong><small>没有登录真实账号</small>
        </header>
        <div id="pane-side" role="grid"></div>
      </div>
      <div id="main">
        <header>
          <span title="测试联系人" data-id="test-chat"
            >测试联系人 · 本地测试会话</span
          ><small>仅用于界面与流程验证，不连接 WhatsApp 服务器</small>
        </header>
        <div id="messages">
          <div class="message-in">
            <div class="copyable-text">
              <span class="selectable-text"
                >Hello, this is a local test message.</span
              >
            </div>
          </div>
          <div class="message-out">
            <div class="copyable-text">
              <span class="selectable-text"
                >Sent message for manual translation.</span
              >
            </div>
          </div>
        </div>
        <footer>
          <div
            role="textbox"
            contenteditable="true"
            aria-label="消息输入框"
          ></div>
          <button aria-label="Send"><span data-icon="send">发送</span></button>
        </footer>
      </div>
    </div>
    <script>
      window.fixture = {
        sent: [],
        bulk: [],
        fail: false,
        nativeInputs: 0,
        ownPhone: '8613800000001',
      };
      // Simulate the affected editor: webpage execCommand cannot replace its text.
      document.execCommand = () => false;
      const chats = [
        {
          id: { _serialized: '10001@g.us', server: 'g.us', user: '10001' },
          name: '测试群组 A',
        },
        {
          id: { _serialized: '10002@c.us', server: 'c.us', user: '10002' },
          name: '测试联系人 B',
        },
      ];
      fixture.chats = chats;
      fixture.openChat = id => {
        chats.forEach(c => {
          c.active = c.id._serialized === id;
        });
        const chat = chats.find(c => c.id._serialized === id);
        const title = document.querySelector('header span');
        title.dataset.id = id;
        title.title = chat?.name || id;
        title.textContent = chat?.name || id;
      };
      fixture.renderChats = () => {
        document.querySelector('#pane-side').replaceChildren(
          ...[...chats]
            .sort((a, b) => (b.pin || 0) - (a.pin || 0))
            .map(chat => {
              chat.set ??= values => {
                if (typeof values !== 'object')
                  throw Error('Native model expects an attribute object');
                Object.assign(chat, values);
                for (const key of Object.keys(values))
                  fixture.chatListeners
                    ?.get('change:' + key)
                    ?.forEach(fn => fn());
                fixture.renderChats();
              };
              const row = document.createElement('div');
              row.className = 'fixture-chat';
              row.setAttribute('role', 'row');
              row.dataset.id = chat.id._serialized;
              row.__reactProps$fixture = { chat };
              const title = document.createElement('div');
              title.className = 'fixture-title';
              title.dataset.testid = 'cell-frame-title';
              const name = document.createElement('span');
              name.title = chat.name;
              name.textContent = chat.name;
              title.append(name);
              const preview = document.createElement('div');
              preview.className = 'fixture-preview';
              preview.textContent = '原生消息预览';
              const menu = document.createElement('button');
              menu.dataset.testid = 'native-chat-menu';
              menu.textContent = '⌄';
              menu.onclick = event => {
                event.stopPropagation();
                document
                  .querySelector('[data-testid=native-pin-popup]')
                  ?.remove();
                const popup = document.createElement('div');
                popup.setAttribute(
                  'role',
                  fixture.menuRole === 'button' ? 'presentation' : 'menu',
                );
                popup.dataset.testid = 'native-pin-popup';
                const item = document.createElement(
                  fixture.barePinItem ? 'li' : 'button',
                );
                if (!fixture.barePinItem)
                  item.setAttribute('role', fixture.menuRole || 'menuitem');
                item.dataset.testid = 'native-pin-item';
                if (!fixture.barePinItem && fixture.menuRole !== 'button')
                  item.dataset.animateDropdownItem = 'true';
                item.textContent = fixture.chineseMenu
                  ? chat.pin
                    ? '取消置顶聊天'
                    : '置顶聊天'
                  : chat.pin
                    ? 'Unpin chat'
                    : 'Pin chat';
                if (fixture.barePinItem) {
                  item.textContent = 'Fixar conversa';
                  const glyph = document.createElement('span');
                  glyph.dataset.icon = 'pin-v2';
                  item.append(glyph);
                }
                item.onmousedown = item.onclick = () => {
                  fixture.nativePinActions =
                    (fixture.nativePinActions || 0) + 1;
                };
                popup.append(item);
                document.body.append(popup);
              };
              row.append(title, preview, menu);
              if (chat.pin) {
                const icon = document.createElement('span');
                icon.dataset.icon = 'pinned';
                row.append(icon);
              }
              row.onclick = () => fixture.openChat(chat.id._serialized);
              return row;
            }),
        );
      };
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape')
          document.querySelector('[data-testid=native-pin-popup]')?.remove();
      });
      fixture.renderChats();
      document.querySelector('#pane-side').addEventListener(
        'pointerdown',
        event => {
          if (event.target.matches('input')) {
            fixture.nativeNoteInterceptions =
              (fixture.nativeNoteInterceptions || 0) + 1;
            event.preventDefault();
            event.stopPropagation();
          }
        },
        true,
      );
      class MsgKey {
        static async newId() {
          return crypto.randomUUID();
        }
        constructor(x) {
          Object.assign(this, x);
          this._serialized = x.id;
        }
      }
      fixture.chatListeners = new Map();
      const modules = {
        WAWebCollections: {
          Chat: {
            on: (name, fn) => {
              if (!fixture.chatListeners.has(name))
                fixture.chatListeners.set(name, new Set());
              fixture.chatListeners.get(name).add(fn);
            },
            off: (name, fn) => fixture.chatListeners.get(name)?.delete(fn),
            getModelsArray: () => chats,
            get: id => {
              const group = fixture.groupRows?.find(g => g.id === id);
              if (group) return group.chat ? group : undefined;
              return chats.find(c => c.id._serialized === id);
            },
          },
        },
        WAWebProfilePicThumbCollection: {
          ProfilePicThumb: {
            get: () =>
              fixture.ownAvatar ? { imgFull: fixture.ownAvatar } : undefined,
          },
        },
        WAWebSocketModel: { Socket: { state: 'CONNECTED' } },
        WAWebConnModel: {
          Conn: {
            pushname: '本地测试账号',
            wid: { server: 'c.us', user: '8613800000001' },
          },
        },
        WAWebUserPrefsMeUser: {
          getMaybeMePnUser: () => ({ server: 'c.us', user: fixture.ownPhone }),
          getMaybeMeLidUser: () => ({
            server: 'lid',
            user: fixture.ownPhone + '9',
          }),
        },
        WAWebChatGetters: {
          getActiveChat: () => {
            if (fixture.missingChatGetter)
              throw new Error('Native getter unavailable');
            return (
              chats.find(
                c =>
                  c.id._serialized ===
                  document.querySelector('header span').dataset.id,
              ) || {
                id: {
                  _serialized: document.querySelector('header span').dataset.id,
                },
              }
            );
          },
        },
        WAWebMsgKey: MsgKey,
        WAWebWidFactory: { asUserWidOrThrow: x => x },
        WAWebGetEphemeralFieldsMsgActionsUtils: {
          getEphemeralFields: () => ({}),
        },
        WAWebSendMsgChatAction: {
          addAndSendMsgToChat: (chat, message) => {
            fixture.bulk.push({ id: chat.id._serialized, text: message.body });
            if (fixture.holdBulk) {
              fixture.bulkReleases ??= [];
              return [
                Promise.resolve(message),
                new Promise(resolve => {
                  fixture.bulkReleases.push(resolve);
                }),
              ];
            }
            return [
              Promise.resolve(message),
              fixture.fail
                ? Promise.reject(Error('synthetic server failure'))
                : Promise.resolve('OK'),
            ];
          },
        },
      };
      fixture.loadPinCommands = () => {
        // Model a command-driven native menu: the limit guard runs before the
        // exported action, without a recognizable DOM menu item.
        modules.WAWebFixtureChatPinAction = {
          getPinLimit: () => 3,
          setPin: async (chat, enabled) => {
            fixture.nativePinServerCalls =
              (fixture.nativePinServerCalls || 0) + 1;
            if (enabled && chats.filter(c => c.pin).length >= 3)
              throw Error('You can only pin up to 3 chats.');
            chat.set({ pin: enabled ? Date.now() : 0 });
          },
        };
        modules.WAWebFixtureMsgPinAction = {
          getPinLimit: () => 3,
          setPin: () => 'message-pin-original',
        };
        modules.WAWebFixtureFrozenChatPinAction = Object.freeze({
          getPinLimit: () => 3,
          setPin: () => 'immutable-original',
        });
      };
      fixture.nativePinCommand = id => {
        const chat = chats.find(c => c.id._serialized === id);
        const action = modules.WAWebFixtureChatPinAction;
        if (
          !chat.pin &&
          chats.filter(c => c.pin).length >= action.getPinLimit()
        ) {
          fixture.nativePinLimitDialogs =
            (fixture.nativePinLimitDialogs || 0) + 1;
          throw Error('You can only pin up to 3 chats.');
        }
        return action.setPin(chat, !chat.pin);
      };
      modules.__debug = { modulesMap: modules };
      window.require = name => {
        if (!modules[name]) throw Error('unsupported ' + name);
        return modules[name];
      };
      fixture.mediaSent = [];
      fixture.edited = [];
      fixture.openEdit = (
        text = '修改消息',
        withRole = true,
        heading = 'Edit message',
      ) => {
        document.querySelector('#fixture-edit')?.remove();
        const root = document.createElement('div');
        root.id = 'fixture-edit';
        if (withRole) root.setAttribute('role', 'dialog');
        else root.dataset.animateModalPopup = 'true';
        root.style.cssText =
          'position:fixed;inset:70px;z-index:120;background:#202c33;padding:30px;display:flex;flex-direction:column;gap:20px';
        const title = document.createElement('h2');
        title.textContent = heading;
        const preview = document.createElement('div');
        preview.dataset.id = 'true_10002@c.us_original';
        preview.textContent = 'Previously sent message';
        const input = document.createElement('div');
        input.contentEditable = 'true';
        input.setAttribute('role', 'textbox');
        input.dataset.lexicalEditor = 'true';
        input.textContent = text;
        const save = document.createElement('button');
        save.dataset.testid = 'fixture-edit-save';
        save.innerHTML = '<span data-icon="checkmark">✓</span>';
        const cancel = document.createElement('button');
        cancel.dataset.testid = 'fixture-edit-cancel';
        cancel.textContent = '取消编辑';
        cancel.onclick = () => root.remove();
        const submit = () => {
          fixture.edited.push(input.textContent);
          root.remove();
        };
        save.onclick = submit;
        input.onkeydown = event => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            submit();
          }
        };
        input.addEventListener('input', event => {
          if (event.isTrusted) fixture.nativeInputs++;
        });
        root.append(title, preview, input, save, cancel);
        document.body.append(root);
        input.focus();
      };
      fixture.openMedia = (caption = '', withRole = true, kind = 'image') => {
        document.querySelector('#fixture-media')?.remove();
        const root = document.createElement('div');
        root.id = 'fixture-media';
        if (withRole) root.setAttribute('role', 'dialog');
        root.style.cssText =
          'position:fixed;inset:30px;z-index:100;background:#202c33;padding:30px;display:flex;flex-direction:column;gap:20px';
        const image = document.createElement(
          kind === 'video' ? 'video' : kind === 'file' ? 'div' : 'img',
        );
        if (kind === 'file') {
          image.dataset.testid = 'document-preview';
          image.innerHTML = '<span title="sample-A.pdf">sample-A.pdf</span>';
        } else
          image.setAttribute(
            'src',
            'blob:https://web.whatsapp.com/synthetic-image-A',
          );
        image.style.height = '100px';
        const wrap = document.createElement('div');
        wrap.dataset.testid = 'media-caption-input-container';
        const input = document.createElement('div');
        input.contentEditable = 'true';
        input.setAttribute('role', 'textbox');
        input.setAttribute('aria-label', 'Add a caption');
        input.dataset.lexicalEditor = 'true';
        input.textContent = caption;
        wrap.append(input);
        const button = document.createElement('div');
        button.setAttribute('role', 'button');
        button.setAttribute('aria-label', 'Send');
        button.tabIndex = 0;
        button.innerHTML =
          '<span data-icon="wds-ic-send-filled">发送图文</span>';
        const close = document.createElement('button');
        close.textContent = '取消图片';
        close.onclick = () => root.remove();
        const send = () => {
          fixture.mediaSent.push({
            caption: input.textContent,
            image: image.getAttribute('src'),
            kind,
            file: image.querySelector('[title]')?.getAttribute('title'),
          });
          root.remove();
        };
        button.onclick = send;
        input.onkeydown = event => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            send();
          }
        };
        input.addEventListener('input', event => {
          if (event.isTrusted) fixture.nativeInputs++;
        });
        root.append(image, wrap, button, close);
        document.body.append(root);
        input.focus();
      };
      const editor = document.querySelector('[contenteditable]');
      editor.addEventListener('input', event => {
        if (event.isTrusted) fixture.nativeInputs++;
      });
      fixture.editorText = () => {
        const clone = editor.cloneNode(true);
        clone
          .querySelectorAll('img[alt]')
          .forEach(img => img.replaceWith(document.createTextNode(img.alt)));
        return clone.textContent || '';
      };
      const send = () => {
        const text = fixture.editorText();
        if (text.trim()) {
          fixture.sent.push(text);
          editor.innerText = '';
          editor.dispatchEvent(new Event('input', { bubbles: true }));
        }
      };
      fixture.installGroupTools = () => {
        fixture.beforeGroupWPP = window.WPP;
        fixture.beforeGroupRequire = window.require;
        fixture.groupRows = [
          {
            id: '10001@g.us',
            subject: '管理群 A',
            announce: false,
            admin: true,
            member: true,
            chat: true,
          },
          {
            id: '10003@g.us',
            subject: '管理群 B',
            announce: false,
            admin: true,
            member: true,
            chat: true,
          },
          {
            id: '10004@g.us',
            subject: '非管理员群',
            announce: false,
            admin: false,
            member: true,
            chat: true,
          },
        ];
        fixture.groupCalls = [];
        fixture.groupFailAfterApply = true;
        fixture.groupIgnoreOnce = true;
        fixture.groupDeleteOnce = true;
        const row = id => fixture.groupRows.find(g => g.id === id);
        const log = (operation, id) =>
          fixture.groupCalls.push({ operation, id, at: Date.now() });
        const previous = window.WPP || {};
        window.WPP = {
          ...previous,
          isReady: true,
          conn: {
            ...previous.conn,
            getMyUserWid: () => fixture.ownPhone + '@c.us',
          },
          whatsapp: {
            ...previous.whatsapp,
            functions: {
              ...previous.whatsapp?.functions,
              queryAllGroups: async () => {
                fixture.groupReads = (fixture.groupReads || 0) + 1;
                return fixture.groupRows
                  .filter(g => g.member)
                  .map(g => ({ ...g }));
              },
            },
            ChatStore: { get: id => (row(id)?.chat ? row(id) : undefined) },
          },
          group: {
            iAmAdmin: async id => Boolean(row(id)?.admin),
            iAmMember: async id => Boolean(row(id)?.member),
            getGroupInfoFromInviteCode: async code => ({
              id: code.startsWith('A') ? '90001@g.us' : '90002@g.us',
              membershipApprovalMode: code.startsWith('B'),
            }),
            setProperty: async (id, property, value) => {
              log(value ? 'mute' : 'open', id);
              if (property !== 'announcement' || !row(id)?.admin)
                throw Error('not admin');
              if (id === '10003@g.us' && fixture.groupIgnoreOnce) {
                fixture.groupIgnoreOnce = false;
                return true;
              }
              row(id).announce = value;
              if (fixture.groupFailAfterApply) {
                fixture.groupFailAfterApply = false;
                throw Error('synthetic lost response after apply');
              }
              return true;
            },
            join: async code => {
              const id = code.startsWith('A') ? '90001@g.us' : '90002@g.us';
              log('join', id);
              const pending = code.startsWith('B');
              if (!row(id))
                fixture.groupRows.push({
                  id,
                  subject: pending ? '审批群' : '进群测试',
                  admin: false,
                  announce: false,
                  member: !pending,
                  chat: !pending,
                });
              return { id, pendingApproval: pending };
            },
            leave: async id => {
              log('leave', id);
              row(id).member = false;
            },
          },
          chat: {
            ...previous.chat,
            delete: async id => {
              if (row(id)?.member) throw Error('must leave before deletion');
              log('delete', id);
              if (id === '10003@g.us' && fixture.groupDeleteOnce) {
                fixture.groupDeleteOnce = false;
                throw Error('synthetic delete failure');
              }
              row(id).chat = false;
              return { status: 200 };
            },
          },
        };
        // Exercise the real broken WA-JS join wrapper and the native fallback.
        const nativeJoin = window.WPP.group.join;
        fixture.groupInviteLoaded = false;
        fixture.groupLazyLoads = 0;
        window.WPP.loader = {
          ...previous.loader,
          ensureLazyModule: async name => {
            if (name !== 'WAWebGroupInviteJob')
              throw Error('wrong lazy module');
            fixture.groupLazyLoads += 1;
            fixture.groupInviteLoaded = true;
            return true;
          },
        };
        window.WPP.group.join = async () => {
          throw new TypeError('(0, d.joinGroupViaInvite) is not a function');
        };
        const nativeModule = {
          joinGroupViaInvite: async (code, approval) => {
            if (!fixture.groupInviteLoaded)
              throw Error('invite bundle not loaded');
            const result = await nativeJoin(code);
            if (result.pendingApproval !== approval)
              throw Error('approval mode mismatch');
            return { gid: result.id };
          },
        };
        window.require = name =>
          name === '__debug'
            ? {
                modulesMap: fixture.groupInviteLoaded
                  ? { WAWebFixtureGroupInviteJob: {} }
                  : {},
              }
            : name === 'WAWebFixtureGroupInviteJob' && fixture.groupInviteLoaded
              ? nativeModule
              : fixture.beforeGroupRequire(name);
        return true;
      };
      document.querySelector('footer button').addEventListener('click', send);
      editor.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
    </script>
  </body>
</html>
