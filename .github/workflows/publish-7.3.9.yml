name: Publish 7.3.9 verified cross-platform stable
'on':
  push:
    branches:
    - publish/7.3.9-stable
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZL_SOURCE_COMMIT: a5dec6fb5fd23c5fbcb4604a63ff1ee7b39dc963
    steps:
    - uses: actions/checkout@v4
      with:
        ref: a5dec6fb5fd23c5fbcb4604a63ff1ee7b39dc963
    - name: Verify same-source successful platform builds
      run: |
        set -euo pipefail
        python3 - <<'VERIFY'
        import json,os,subprocess,time
        repo=os.environ['GH_REPO']
        def api(path,post=False):
         args=['gh','api']+(['--method','POST'] if post else [])+[f'repos/{repo}/{path}']
         data=subprocess.check_output(args,text=True)
         return json.loads(data) if data.strip() else None
        main=api('actions/runs/44151675728')
        assert main['head_sha']==os.environ['ZL_SOURCE_COMMIT']
        main_jobs=api('actions/runs/44151675728/jobs?filter=all&per_page=100')['jobs']
        for name in ['windows','macos (x64, macos-26-intel)']:
         assert any(j['name']==name and j['conclusion']=='success' for j in main_jobs),name
        builds=[(44151675728,os.environ['ZL_SOURCE_COMMIT']),(44154160738,'dbad699fc00cecec5a3113e74238272311061877')]
        retried=set();budget={run:0 for run,_ in builds}
        for attempt in range(360):
         for run,head in builds:
          r=api(f'actions/runs/{run}');assert r['head_sha']==head
          jobs=api(f'actions/runs/{run}/jobs?filter=all&per_page=100')['jobs']
          arms=[j for j in jobs if j['name'].startswith('macos (arm64,')]
          if not arms:continue
          latest=max(arms,key=lambda j:j['id'])
          if latest['status']=='completed' and latest['conclusion']=='success':
           with open(os.environ['GITHUB_ENV'],'a') as env:env.write(f'ARM_RUN_ID={run}\n')
           print('Selected successful native arm64 job',latest['id'],'from run',run)
           raise SystemExit(0)
          if latest['conclusion']=='cancelled' and latest['id'] not in retried and budget[run]<3:
           annotations=api(f'check-runs/{latest["id"]}/annotations')
           capacity=any('capacity' in a.get('message','').lower() or 'not acquired by runner' in a.get('message','').lower() for a in annotations)
           if capacity:
            api(f'actions/jobs/{latest["id"]}/rerun',post=True)
            retried.add(latest['id']);budget[run]+=1
            print('Retried native arm64 job after capacity cancellation',latest['id'])
         time.sleep(20)
        raise AssertionError('Native arm64 capacity unavailable; no release published')
        VERIFY
    - uses: actions/download-artifact@v4
      with:
        name: ZL-WA-7.3.9-Windows-x64
        run-id: 44151675728
        github-token: ${{ github.token }}
        path: release-assets
    - uses: actions/download-artifact@v4
      with:
        name: ZL-WA-7.3.9-macOS-x64
        run-id: 44151675728
        github-token: ${{ github.token }}
        path: release-assets
    - uses: actions/download-artifact@v4
      with:
        name: ZL-WA-7.3.9-macOS-arm64
        run-id: ${{ env.ARM_RUN_ID }}
        github-token: ${{ github.token }}
        path: release-assets
    - name: Validate all packages and reports
      run: |
        python3 - <<'VERIFY'
        import hashlib,json,os,pathlib
        root=pathlib.Path('release-assets')
        expected={'ZL-WA-win-AutoSetup-7.3.9-x64.exe','ZL-WA-win-Portable-7.3.9-x64.exe'}
        expected|={f'ZL-WA-macOS-7.3.9-{arch}.{ext}' for arch in ['x64','arm64'] for ext in ['dmg','zip']}
        actual={p.name for p in root.iterdir() if p.suffix in ['.exe','.dmg','.zip']}
        assert actual==expected,(actual,expected)
        commit=os.environ['ZL_SOURCE_COMMIT']
        w=json.loads((root/'windows-startup-verification.json').read_text(encoding='utf-8-sig'))
        assert w['version']=='7.3.9' and w['commit']==commit and w['nativePackagedStartup'] and w['mainProcessResumeReload']
        notes=pathlib.Path('docs/releases/7.3.9.md').read_text()+'\n## macOS 签名状态\n'
        for arch in ['x64','arm64']:
         v=json.loads((root/f'verification-{arch}.json').read_text())
         assert v['version']=='7.3.9' and v['arch']==arch and v['commit']==commit
         assert v['signatureValid'] and v['zipDmgPayloadIdentical'] and v['startup']['nativePackagedStartup']
         for f in v['files']:
          p=root/f['name']
          with p.open('rb') as stream: assert hashlib.file_digest(stream,'sha256').hexdigest()==f['sha256']
         label='Intel' if arch=='x64' else 'Apple 芯片（M 系列）'
         notes+=f"- {label}：签名方式 {v['signing']}；Apple 公证：{'已完成' if v['notarized'] else '未配置，尚未公证'}。\n"
         if not v['notarized']: notes+='  首次打开如被 macOS 阻止，请在“系统设置 → 隐私与安全性”中查看并允许打开。\n'
        checksums=[]
        for name in sorted(expected):
         p=root/name
         assert p.stat().st_size>1000000
         with p.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
         checksums.append(f'{digest}  {name}')
        (root/'SHA256SUMS.txt').write_text('\n'.join(checksums)+'\n')
        pathlib.Path('release-notes.md').write_text(notes+f'\n源码提交：`{commit}`。\n')
        VERIFY
    - name: Publish Windows and macOS together as stable 7.3.9
      run: |
        set -euo pipefail
        if ! gh api repos/$GH_REPO/git/ref/tags/v7.3.9 > tag.json 2>/dev/null; then
          gh api --method POST repos/$GH_REPO/git/refs -f ref=refs/tags/v7.3.9 -f sha="$ZL_SOURCE_COMMIT" > /dev/null
        fi
        gh api repos/$GH_REPO/git/ref/tags/v7.3.9 > tag.json
        python3 -c 'import json,os; t=json.load(open("tag.json")); assert t["object"]["type"]=="commit" and t["object"]["sha"]==os.environ["ZL_SOURCE_COMMIT"]'
        if gh release view v7.3.9 --json isDraft,assets > existing.json 2>/dev/null; then
          for attempt in $(seq 1 30); do
            gh release view v7.3.9 --json isDraft,assets > existing.json
            if python3 - <<'EXISTS'
        import json
        r=json.load(open('existing.json'))
        expected={'ZL-WA-win-AutoSetup-7.3.9-x64.exe','ZL-WA-win-Portable-7.3.9-x64.exe'}|{f'ZL-WA-macOS-7.3.9-{a}.{e}' for a in ['x64','arm64'] for e in ['dmg','zip']}
        assert not r['isDraft'] and expected<={a['name'] for a in r['assets']}
        EXISTS
            then exit 0; fi
            sleep 10
          done
          exit 1
        fi
        gh release create v7.3.9 release-assets/* --verify-tag --target "$ZL_SOURCE_COMMIT" --draft --title 'ZL-WA 7.3.9' --notes-file release-notes.md
        gh api repos/$GH_REPO/git/ref/tags/v7.3.9 > tag.json
        python3 -c 'import json,os; t=json.load(open("tag.json")); assert t["object"]["type"]=="commit" and t["object"]["sha"]==os.environ["ZL_SOURCE_COMMIT"]'
        gh release edit v7.3.9 --draft=false --prerelease=false --latest
