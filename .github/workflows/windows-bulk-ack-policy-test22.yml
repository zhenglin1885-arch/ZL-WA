name: Windows bulk failed ACK policy test22
'on':
  push:
    branches:
      - build/bulk-ack-policy-test22
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Validate release version
        run: node -e "if (require('./package.json').version !== '7.3.9') throw Error('Version mismatch')"
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --frozen-lockfile
          pnpm package
      - name: Check types and tests
        shell: pwsh
        run: |
          pnpm typecheck *> typecheck.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content typecheck.log -Tail 100
            exit 1
          }
          pnpm lint *> lint.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content lint.log -Tail 100
            exit 1
          }
          pnpm test --runInBand --coverage=false *> tests.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content tests.log -Tail 150
            exit 1
          }
          Get-Content tests.log -Tail 8
      - name: Prepare the production NSIS compiler and plugins
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'zl-nsis'
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($item in @('nsis-3.0.4.1', 'nsis-resources-3.4.1')) {
            $file = Join-Path $root ($item + '.7z')
            Invoke-WebRequest -UseBasicParsing "https://github.com/electron-userland/electron-builder-binaries/releases/download/$item/$item.7z" -OutFile $file
            & 'C:\Program Files\7-Zip\7z.exe' x $file "-o$root\$item" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          }
          "ZL_NSIS_HOME=$root\nsis-3.0.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZL_NSIS_RESOURCES=$root\nsis-resources-3.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify process isolation and installation from the old app directory
        shell: powershell
        run: |
          try {
            ./scripts/test-windows-installer.ps1 *>&1 | Tee-Object -FilePath installer-test.log
          } catch {
            $message = ($_ | Out-String).Trim()
            Write-Output ("::error::" + $message.Replace("`r", '').Replace("`n", '%0A'))
            throw
          } finally {
            if (Test-Path installer-test.log) {
              '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content installer-test.log | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - name: Build Windows x64
        run: pnpm build:windows
      - name: Verify compiled native login observation in Windows Electron
        shell: pwsh
        env:
          ZL_LOGIN_DIAGNOSTICS_REPORT: out/windows-login-diagnostics-verification.json
        run: |
          pnpm exec electron scripts/verify-native-login-diagnostics.cjs --no-sandbox --disable-gpu *> login-diagnostics-test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content login-diagnostics-test.log -Tail 80
            exit 1
          }
          Get-Content login-diagnostics-test.log
      - name: Verify tested WhatsApp adapter inside packaged application
        run: node scripts/verify-whatsapp-library.cjs out/win-unpacked/resources/app.asar
      - name: Verify packaged Windows startup and resume reload
        shell: pwsh
        run: |
          node scripts/verify-windows-package.mjs out/win-unpacked/ZL-WA.exe *> startup-test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content startup-test.log -Tail 80
            exit 1
          }
          Get-Content startup-test.log
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-WA-7.3.9-Windows-x64
          path: |
            out/*.exe
            out/windows-startup-verification.json
            out/windows-login-diagnostics-verification.json
          if-no-files-found: error
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source and regression evidence
        run: |
          set -euo pipefail
          git diff --name-only eac215bfbbb4f918bfee13ee1fcbf7e2a1dd045f HEAD -- src build-helpers esbuild.mjs package.json pnpm-lock.yaml scripts test .github/workflows/windows-bulk-ack-policy-test22.yml docs/BULK-ACK-POLICY-TEST22.md > changed.txt
          python3 - <<'VERIFY'
          import json,pathlib,hashlib
          r=json.load(open('qa/bulk-ack-policy-test22.json'))
          assert r['sourceBase']=='eac215bfbbb4f918bfee13ee1fcbf7e2a1dd045f'
          assert r['typecheck'] and r['unitTests']['passed']==989 and r['unitTests']['suitesPassed']==89 and r['unitTests']['skipped']==2
          assert r['existingGuiPassGroups']==52 and r['originalWebUiPreserved'] and not r['realPhonePairingVerified']
          assert r['registrationObserverVerified'] and r['registrationStages']==12 and r['compiledGuestVerified']
          assert r['bulkFailurePolicyVerified'] and r['bulkOpenGroupsOnly'] and not r['diagnosticsOnly'] and r['officialCloseCategories']==47 and r['transportCloseCategories']==22 and r['applicationCloseCategories']==25 and r['passkeyEvents']==4 and r['passkeySurfaceStates']==7
          assert r['structuredClosePayloadVerified'] and r['missingPayloadKindVerified']
          assert set(pathlib.Path('changed.txt').read_text().splitlines())==set(r['sourceFiles'])
          assert {p for p in r['sourceFiles'] if p.startswith('src/')}=={'src/features/accountTools/BulkQueue.ts','src/features/accountTools/bulkGuest.ts','src/features/accountTools/bulkRuntime.ts','src/features/accountTools/config.ts'}
          assert not any(p.startswith('build-helpers/') or p in ['esbuild.mjs','package.json','pnpm-lock.yaml'] for p in r['sourceFiles'])
          for p,d in r['sourceFiles'].items():assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==d,p
          for p,d in r['unchangedBusinessFiles'].items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==d,p
            import subprocess
            assert pathlib.Path(p).read_bytes()==subprocess.check_output(['git','show',r['sourceBase']+':'+p]),p
          for p in ['src/features/protocol','src/electron/ProtocolConnections.ts','src/electron/OfficialWhatsAppLogin.ts','tools/protocol-backend']:assert not pathlib.Path(p).exists(),p
          VERIFY
      - uses: actions/download-artifact@v4
        with:
          name: ZL-WA-7.3.9-Windows-x64
          path: release-assets
      - name: Verify installable native report and hash every asset
        run: |
          python3 - <<'VERIFY'
          import pathlib,json,hashlib,shutil,os
          root=pathlib.Path('release-assets')
          report=json.loads((root/'windows-startup-verification.json').read_text(encoding='utf-8-sig'))
          assert report['commit']==os.environ['GITHUB_SHA'] and report['nativePackagedStartup'] and report['mainProcessResumeReload']
          login=json.loads((root/'windows-login-diagnostics-verification.json').read_text(encoding='utf-8-sig'))
          assert login['commit']==os.environ['GITHUB_SHA'] and login['platform']=='win32'
          assert login['officialCloseCategories']==47 and login['transportCloseCategories']==22 and login['applicationCloseCategories']==25 and login['passkeyEvents']==4 and login['passkeySurfaceStates']==7 and login['compiledGuestVerified'] and login['browserApisUnchanged'] and not login['realPhonePairingVerified']
          assert login['structuredClosePayloadVerified'] and login['missingPayloadKindVerified']
          assert login['registrationObserverVerified'] and login['registrationStages']==12
          names={'ZL-WA-win-AutoSetup-7.3.9-x64.exe','ZL-WA-win-Portable-7.3.9-x64.exe'}
          assert {p.name for p in root.glob('*.exe')}==names
          for n in names:
            p=root/n;assert p.stat().st_size>1000000 and p.open('rb').read(2)==b'MZ';p.rename(root/n.replace('7.3.9-x64','7.3.9-bulk-test22-x64'))
          for source,target in [('qa/bulk-ack-policy-test22.json','QA-summary.json'),('qa/bulk-ack-policy-gui-test22.txt','GUI-checks.txt'),('docs/BULK-ACK-POLICY-TEST22.md','README-test22.md')]:shutil.copyfile(source,root/target)
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
          VERIFY
      - name: Publish original-web compatibility test, without updating stable release
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'NOTES'
          Windows 7.3.9 群发失败跳过修正 test22。
          修正普通消息明确失败（例如 ACK=-1）被强制暂停、错误显示为待确认，覆盖“跳过失败”选项的问题。普通消息已知失败时记为失败，按所选策略继续下一对象或停止；立即失败和延迟失败回执均覆盖，不自动重发原消息。无消息编号、未决超时、未知或设备协议异常仍保留暂停保护。
          保留 test21 的全员可发言群筛选；发送顺序、其他任务、界面、群管理、翻译、代理、语音、账号备注与网页登录逻辑未修改。发布门禁限制相对 test21 仅允许四个失败处理相关源文件发生变化，并核对源码哈希及回归证据。
          989 项测试、52 组真实 Electron 合成界面回归通过，包括立即/延迟负 ACK 的继续和停止策略、历史结果只读核对、不重复提交、原群发与其他功能回归。Windows 安装升级及成品启动/恢复由本次工作流验证，报告和 SHA256 随包提供。
          完全退出旧软件后安装。先使用少量测试对象核对“跳过失败”和“遇到失败即停止”。旧的已结束任务不会自动恢复或重发。
          独立未签名 Windows 测试包，不推送正式更新，未发布 Mac。本次不修改网页登录流程；此前账号关联失败尚未确认修复。
          NOTES
          gh release create test-7.3.9-bulk-ack-policy-22 release-assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'ZL-WA 7.3.9 Windows 群发失败跳过修正 test22' --notes-file /tmp/notes.md
