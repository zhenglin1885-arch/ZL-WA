name: Publish Windows 7.3.9 stable first
on:
  push:
    branches: ['publish/7.3.9-windows-first']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZL_SOURCE_COMMIT: a5dec6fb5fd23c5fbcb4604a63ff1ee7b39dc963
    steps:
      - name: Verify successful Windows build at release source
        run: |
          gh api repos/$GH_REPO/actions/runs/44151675728 > run.json
          gh api 'repos/'$GH_REPO'/actions/runs/44151675728/jobs?filter=all&per_page=100' > jobs.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('run.json'));assert r['head_sha']==os.environ['ZL_SOURCE_COMMIT']
          jobs=[j for j in json.load(open('jobs.json'))['jobs'] if j['name']=='windows' and j['conclusion']=='success']
          assert jobs
          steps={s['name']:s['conclusion'] for s in jobs[0]['steps']}
          for name in ['Check types and tests','Verify process isolation and installation from the old app directory','Build Windows x64','Verify packaged Windows startup and resume reload','Run actions/upload-artifact@v4']:
            assert steps[name]=='success',name
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ZL-WA-7.3.9-Windows-x64
          run-id: 44151675728
          github-token: ${{ github.token }}
          path: out
      - name: Validate packages and write checksums
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          root=pathlib.Path('out')
          expected={'ZL-WA-win-AutoSetup-7.3.9-x64.exe','ZL-WA-win-Portable-7.3.9-x64.exe'}
          assert {p.name for p in root.glob('*.exe')}==expected
          r=json.loads((root/'windows-startup-verification.json').read_text(encoding='utf-8-sig'))
          assert r['version']=='7.3.9' and r['commit']==os.environ['ZL_SOURCE_COMMIT']
          assert r['nativePackagedStartup'] and r['mainProcessResumeReload']
          lines=[]
          for name in sorted(expected):
            p=root/name;assert p.stat().st_size>1000000
            with p.open('rb') as f:
              assert f.read(2)==b'MZ';f.seek(0);digest=hashlib.file_digest(f,'sha256').hexdigest()
            lines.append(f'{digest}  {name}')
          (root/'SHA256SUMS-Windows-7.3.9.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Publish stable Windows release
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          # ZL-WA 7.3.9

          Windows x64 正式版现已发布，提供安装版（AutoSetup）和免安装版（Portable）。Mac Intel 与 Apple 芯片版本待原生验证齐全后另行补充，不影响 Windows 下载。

          ## 本次更新
          - 账号侧栏与聚合会话分组支持鼠标拖动排序，重启后保留顺序。
          - 客户 SABCD 标记采用金黄、红、蓝、绿、紫色，增加细轮廓，显示在昵称后。
          - 聚合会话支持直接编辑红色备注，聊天顶部保留联系人／群组名称。
          - 群内消息置顶沿用 WhatsApp 官方行为，与聊天列表本地置顶隔离。
          - 新消息声音增加独立兜底，音量提高到 85%，保留静音和免打扰设置。
          - 分组移动前锁定本次选择并展示数量、名单和全选范围；历史分组异常不自动回滚。
          - 新建群发任务按各账号内所选群组列表从下往上发送，立即和定时发送均适用。
          - Facebook Business 登录状态点：已登录绿点、未登录红点、加载或状态不明灰点。

          Windows 已通过完整类型检查、自动测试、安装升级检查和打包后原生启动／恢复验证，附带 SHA256 校验值及验证报告。建议升级前备份当前数据；免安装版继续使用原有 ZL-WAAppData 目录。
          NOTES
          echo "" >> notes.md
          echo "源码提交：\`$ZL_SOURCE_COMMIT\`。" >> notes.md
          if ! gh api repos/$GH_REPO/git/ref/tags/v7.3.9 > tag.json 2>/dev/null; then
            gh api --method POST repos/$GH_REPO/git/refs -f ref=refs/tags/v7.3.9 -f sha="$ZL_SOURCE_COMMIT" > /dev/null
          fi
          gh api repos/$GH_REPO/git/ref/tags/v7.3.9 > tag.json
          python3 -c 'import json,os;t=json.load(open("tag.json"));assert t["object"]["type"]=="commit" and t["object"]["sha"]==os.environ["ZL_SOURCE_COMMIT"]'
          gh release create v7.3.9 out/*.exe out/SHA256SUMS-Windows-7.3.9.txt out/windows-startup-verification.json --verify-tag --target "$ZL_SOURCE_COMMIT" --draft --title 'ZL-WA 7.3.9' --notes-file notes.md
          gh release edit v7.3.9 --draft=false --prerelease=false --latest
