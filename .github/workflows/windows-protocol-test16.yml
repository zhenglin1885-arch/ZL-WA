name: Windows protocol integration test16
'on':
  push:
    branches:
      - build/protocol-integration-test16
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Validate release version
        run: node -e "if (require('./package.json').version !== '7.3.9') throw Error('Version mismatch')"
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Install protocol runtime for native Windows
        run: npm ci --prefix tools/protocol-backend
      - name: Test protocol model
        run: npm test --prefix tools/protocol-backend
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --frozen-lockfile
          pnpm package
      - name: Check types and tests
        shell: pwsh
        run: |
          pnpm typecheck *> typecheck.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content typecheck.log -Tail 100
            exit 1
          }
          pnpm test --runInBand --coverage=false *> tests.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content tests.log -Tail 150
            exit 1
          }
          Get-Content tests.log -Tail 8
      - name: Prepare the production NSIS compiler and plugins
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'zl-nsis'
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($item in @('nsis-3.0.4.1', 'nsis-resources-3.4.1')) {
            $file = Join-Path $root ($item + '.7z')
            Invoke-WebRequest -UseBasicParsing "https://github.com/electron-userland/electron-builder-binaries/releases/download/$item/$item.7z" -OutFile $file
            & 'C:\Program Files\7-Zip\7z.exe' x $file "-o$root\$item" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          }
          "ZL_NSIS_HOME=$root\nsis-3.0.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZL_NSIS_RESOURCES=$root\nsis-resources-3.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify process isolation and installation from the old app directory
        shell: powershell
        run: |
          try {
            ./scripts/test-windows-installer.ps1 *>&1 | Tee-Object -FilePath installer-test.log
          } catch {
            $message = ($_ | Out-String).Trim()
            Write-Output ("::error::" + $message.Replace("`r", '').Replace("`n", '%0A'))
            throw
          } finally {
            if (Test-Path installer-test.log) {
              '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content installer-test.log | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - name: Build Windows x64
        run: pnpm build:windows
      - name: Verify tested WhatsApp adapter inside packaged application
        run: node scripts/verify-whatsapp-library.cjs out/win-unpacked/resources/app.asar
      - name: Verify packaged Windows startup and resume reload
        shell: pwsh
        run: |
          node scripts/verify-windows-package.mjs out/win-unpacked/ZL-WA.exe *> startup-test.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content startup-test.log -Tail 80
            exit 1
          }
          Get-Content startup-test.log
      - name: Preserve failed native verification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test16-failure-evidence
          path: |
            startup-test.log
            out/*.exe
            out/win-unpacked/resources/protocol-backend/package.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-WA-7.3.9-Windows-x64
          path: |
            out/*.exe
            out/windows-startup-verification.json
          if-no-files-found: error
  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scope and recorded native UI checks
        run: |
          set -euo pipefail
          git diff --name-only 04634bf2c1747d5da81f969f880f47d18dcaee1a HEAD -- src scripts build-helpers electron-builder.yml package.json pnpm-lock.yaml tools/protocol-backend test .github/workflows/windows-protocol-test16.yml docs/PROTOCOL-CONNECTION-TEST16.md > changed.txt
          python3 - <<'VERIFY'
          import pathlib,json,hashlib
          r=json.load(open('qa/protocol-integration-test16.json'))
          assert r['sourceBase']=='04634bf2c1747d5da81f969f880f47d18dcaee1a'
          assert r['typecheck'] and r['unitTests']['passed']==1004 and r['unitTests']['suitesPassed']==94 and r['unitTests']['skipped']==2
          assert r['protocolModelTests']==34 and r['existingGuiPassGroups']==51 and r['protocolUiPassed']
          assert not r['realIntegratedPhoneLoginVerified']
          assert set(pathlib.Path('changed.txt').read_text().splitlines())==set(r['sourceFiles'])
          for name,digest in r['sourceFiles'].items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          for key in ['workerStarted','isolatedProfiles','persistedWorkerReload','diagnosticsRedacted','accountPathsValidated','imageCodec','voiceCodec','videoCodec']:assert r['nativeBackend'][key],key
          VERIFY
      - uses: actions/download-artifact@v4
        with:
          name: ZL-WA-7.3.9-Windows-x64
          path: release-assets
      - name: Validate native packaged backend and final artifacts
        run: |
          python3 - <<'VERIFY'
          import pathlib,json,hashlib,shutil,os
          root=pathlib.Path('release-assets');r=json.loads((root/'windows-startup-verification.json').read_text(encoding='utf-8-sig'))
          assert r['commit']==os.environ['GITHUB_SHA'] and r['nativePackagedStartup'] and r['mainProcessResumeReload']
          n=r['protocolBackend']
          for key in ['workerStarted','isolatedProfiles','persistedWorkerReload','diagnosticsRedacted','accountPathsValidated','imageCodec','voiceCodec','videoCodec']:assert n[key],key
          assert not n['realPhoneLoginVerified']
          expected={'ZL-WA-win-AutoSetup-7.3.9-x64.exe','ZL-WA-win-Portable-7.3.9-x64.exe'};assert {p.name for p in root.glob('*.exe')}==expected
          for name in expected:
            p=root/name;assert p.stat().st_size>1000000 and p.open('rb').read(2)==b'MZ';p.rename(root/name.replace('7.3.9-x64','7.3.9-protocol-test16-x64'))
          shutil.copyfile('qa/protocol-integration-test16.json',root/'QA-summary.json');shutil.copyfile('qa/protocol-interface-gui-pass-test16.txt',root/'GUI-checks.txt');shutil.copyfile('docs/PROTOCOL-CONNECTION-TEST16.md',root/'README-test16.md')
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.file_digest(p.open('rb'),'sha256').hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
          VERIFY
      - name: Publish separate Windows integration test
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'NOTES'
          根据用户提供的 WhatsApp 界面调整新连接的聊天界面，修复继承全局 div 高度 100% 导致聊天列表只露出一项、标题和输入区挤占空间的问题。
          新增紧凑列表、真实头像读取（隐私设置不允许时显示占位图）、搜索、全部/未读/群聊/归档筛选、聊天备注与标记预览、右侧消息气泡和固定输入栏。长历史默认定位最新；阅读旧消息时保持位置并提供“回到最新消息”。新建聊天使用独立号码输入，避免搜索框误触报错。连接选项移入菜单。
          设备标识按实际操作系统设置，Windows 新关联不再使用库默认 Mac OS 标签。已有手机记录可能保留旧标签；不会强制退出或删除登录资料。
          原网页登录方式、群发倒序、Enter/Shift+Enter 设置、原队列规则保持。新连接继续为非官方协议实现和直连测试，不是官方桌面接口。没有移植通话、状态、频道、完整历史等全部官方功能。
          原功能自动测试、受控 GUI 与新界面长列表/百条历史/窗口尺寸/键盘测试通过；Windows 安装、成品启动恢复、隔离及媒体组件检查通过。用户反馈 test15 已能建立关联并同步；本版真实账号收发、媒体、群操作仍需验收。未宣称所有功能已完成真实服务器验证。
          使用：完全退出旧软件后安装，在账户菜单选择“使用新连接（测试）”。已经使用新连接的账户保留其登录资料。Windows 未签名测试包，未改正式版，未发布 Mac。
          NOTES
          gh release create test-7.3.9-protocol-interface-16 release-assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'ZL-WA 7.3.9 Windows 新连接聊天界面测试版 test16' --notes-file /tmp/notes.md
