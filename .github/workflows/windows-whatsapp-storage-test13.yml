name: Windows WhatsApp storage persistence test13
'on':
  push:
    branches:
    - build/whatsapp-storage-test13
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: pnpm/action-setup@v4
    - name: Validate release version
      run: node -e "if (require('./package.json').version !== '7.3.9') throw Error('Version mismatch')"
    - name: Install dependencies and Electron
      run: |
        pnpm install --frozen-lockfile
        pnpm exec install-electron
    - name: Package service recipes
      working-directory: recipes
      run: |
        pnpm install --frozen-lockfile
        pnpm package
    - name: Check types and tests
      shell: pwsh
      run: |
        pnpm typecheck *> typecheck.log
        if ($LASTEXITCODE -ne 0) {
          Get-Content typecheck.log -Tail 100
          exit 1
        }
        pnpm test --runInBand --coverage=false *> tests.log
        if ($LASTEXITCODE -ne 0) {
          Get-Content tests.log -Tail 150
          exit 1
        }
        Get-Content tests.log -Tail 8
    - name: Prepare the production NSIS compiler and plugins
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $root = Join-Path $env:RUNNER_TEMP 'zl-nsis'
        New-Item -ItemType Directory -Path $root | Out-Null
        foreach ($item in @('nsis-3.0.4.1', 'nsis-resources-3.4.1')) {
          $file = Join-Path $root ($item + '.7z')
          Invoke-WebRequest -UseBasicParsing "https://github.com/electron-userland/electron-builder-binaries/releases/download/$item/$item.7z" -OutFile $file
          & 'C:\Program Files\7-Zip\7z.exe' x $file "-o$root\$item" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
        }
        "ZL_NSIS_HOME=$root\nsis-3.0.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "ZL_NSIS_RESOURCES=$root\nsis-resources-3.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
    - name: Verify process isolation and installation from the old app directory
      shell: powershell
      run: |
        try {
          ./scripts/test-windows-installer.ps1 *>&1 | Tee-Object -FilePath installer-test.log
        } catch {
          $message = ($_ | Out-String).Trim()
          Write-Output ("::error::" + $message.Replace("`r", '').Replace("`n", '%0A'))
          throw
        } finally {
          if (Test-Path installer-test.log) {
            '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content installer-test.log | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
        }
    - name: Build Windows x64
      run: pnpm build:windows
    - name: Verify tested WhatsApp adapter inside packaged application
      run: node scripts/verify-whatsapp-library.cjs out/win-unpacked/resources/app.asar
    - name: Verify packaged Windows startup and resume reload
      shell: pwsh
      run: |
        node scripts/verify-windows-package.mjs out/win-unpacked/ZL-WA.exe *> startup-test.log
        if ($LASTEXITCODE -ne 0) {
          Get-Content startup-test.log -Tail 80
          exit 1
        }
        Get-Content startup-test.log
    - uses: actions/upload-artifact@v4
      with:
        name: ZL-WA-7.3.9-Windows-x64
        path: |
          out/*.exe
          out/windows-startup-verification.json
        if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Validate completed Windows and GUI checks
      run: |
        set -euo pipefail
        git diff --name-only b1837882c644f5a889121d5ce510afad919e4d5b HEAD -- src build-helpers esbuild.mjs package.json pnpm-lock.yaml > changed.txt
        gh api repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs > jobs.json
        python3 - <<'VERIFY'
        import json,hashlib,pathlib
        assert set(pathlib.Path('changed.txt').read_text().splitlines())=={'src/index.ts','src/electron/whatsappStoragePermission.ts'}
        w=next(j for j in json.load(open('jobs.json'))['jobs'] if j['name']=='windows');assert w['conclusion']=='success'
        s={x['name']:x['conclusion'] for x in w['steps']}
        for n in ['Check types and tests','Verify process isolation and installation from the old app directory','Build Windows x64','Verify tested WhatsApp adapter inside packaged application','Verify packaged Windows startup and resume reload','Run actions/upload-artifact@v4']:assert s[n]=='success',n
        r=json.load(open('qa/storage-persistence.json'));assert r['sourceBase']=='b1837882c644f5a889121d5ce510afad919e4d5b' and r['unitTests']['passed']==966 and r['unitTests']['suitesPassed']==88
        n=r['nativeChecks'];assert not any(n['baseline'].values()) and all(n['officialWhatsApp'].values()) and not any(n['unrelatedOrigin'].values()) and not any(n['facebookUnchanged'].values())
        assert n['servicePermissionHandlersInstalled'] and all(n['actualServiceWebview'].values())
        assert n['officialWorker']['persisted'] and n['recordsRetainedAfterReload'] and n['accountSessionsIsolated'] and n['persistentPermissionObserved'] and not n['realPhonePairingVerified']
        assert r['existingGuiPassGroups']==51
        for path,digest in r['sourceFiles'].items():assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest,path
        VERIFY
    - uses: actions/download-artifact@v4
      with:
        name: ZL-WA-7.3.9-Windows-x64
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
        path: release-assets
    - name: Validate actual packages and preserve test evidence
      run: |
        python3 - <<'VERIFY'
        import pathlib,json,hashlib,shutil,os
        root=pathlib.Path('release-assets')
        expected={'ZL-WA-win-AutoSetup-7.3.9-x64.exe','ZL-WA-win-Portable-7.3.9-x64.exe'};assert {p.name for p in root.glob('*.exe')}==expected
        v=json.loads((root/'windows-startup-verification.json').read_text(encoding='utf-8-sig'));assert v['version']=='7.3.9' and v['commit']==os.environ['GITHUB_SHA'] and v['nativePackagedStartup'] and v['mainProcessResumeReload']
        lines=[]
        for name in sorted(expected):
         p=root/name;assert p.stat().st_size>1000000
         with p.open('rb') as f:
          assert f.read(2)==b'MZ';f.seek(0);digest=hashlib.file_digest(f,'sha256').hexdigest()
         renamed=name.replace('7.3.9-x64','7.3.9-storage-test13-x64');p.rename(root/renamed);lines.append(f'{digest}  {renamed}')
        (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
        shutil.copyfile('qa/storage-persistence.json',root/'QA-summary.json')
        shutil.copyfile('qa/storage-persistence-gui-pass.txt',root/'GUI-checks.txt')
        VERIFY
    - name: Publish independently verified Windows test build
      run: |
        set -euo pipefail
        cat > release-notes.md <<'NOTES'
        Windows 7.3.9 WhatsApp 存储权限修复测试版 test13。

        已在同版本 Electron 中复现：软件现有权限白名单拒绝 persistent-storage，使 StorageManager.persist() 与 StorageBucket.persist() 均返回 false，与反馈中的存储持久化被拒绝错误一致。

        本次只补齐 HTTPS WhatsApp 官方来源的持久存储权限检查与请求处理；校验请求来源、当前顶层页面和已提供的嵌入来源。不清除或迁移任何账号数据，不重置登录状态。群发顺序、群管理、备注、翻译和默认 Enter 发送规则均未改动。

        已验证：类型检查；88 组自动测试、966 项通过、2 项既有跳过；实际原权限回调与修复回调的 Chromium StorageManager/StorageBucket 对照；刷新后的数据库读取、两个账号 Session 隔离、Worker 读取已持久化 Bucket、其他来源及 Facebook 原权限保持不变；51 组既有界面回归；Windows 安装升级、内置兼容库、成品启动和恢复加载。

        真实手机扫码仍需验证。此包修复已确认可复现的存储权限拒绝，不能把受控存储检查通过等同于真实配对成功。

        安装后完全退出再打开，使用之前失败的账号扫码。无需在 Console 输入命令或开启粘贴权限。若仍失败，请复制发送诊断，并查看是否还有 storage bucket persistence denied 错误；不需要清空账号、Cookie 或备注。
        NOTES
        gh release create test-7.3.9-whatsapp-storage-13 release-assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'ZL-WA 7.3.9 Windows WhatsApp 存储权限修复测试版' --notes-file release-notes.md
    needs: windows
    permissions:
      contents: write
      actions: read
