name: ZL-WA Windows

on:
  # Isolated fallback for this test build while the local GitHub API is unavailable.
  push:
    branches: ['test/7.3.5-20261029-11']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag (e.g. v7.2.5); leave empty for artifacts only'
        required: false
        type: string

      download_tag:
        description: 'Standalone test download tag; never updates the stable release'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate release version
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match package.json version.' }
      - name: Validate standalone download
        if: inputs.download_tag != '' || github.event_name == 'push'
        shell: pwsh
        env:
          DOWNLOAD_TAG: ${{ inputs.download_tag || 'test-7.3.5-20261029-11' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG) { throw 'Choose either a formal release or a standalone test download.' }
          if ($env:DOWNLOAD_TAG -notmatch '^test-[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9]+$') {
            throw 'Invalid standalone download tag.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --frozen-lockfile
          pnpm package
      - name: Check types and tests
        shell: pwsh
        run: |
          pnpm typecheck *> typecheck.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content typecheck.log -Tail 100) -join '%0A'
            Write-Output "::error title=Typecheck failed::$details"
            exit 1
          }
          pnpm test --runInBand --coverage=false *> tests.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content tests.log -Tail 150) -join '%0A'
            Write-Output "::error title=Tests failed::$details"
            exit 1
          }
          Get-Content tests.log -Tail 8
      - name: Build Windows x64
        run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-WA-Windows-x64
          path: out/*.exe
          if-no-files-found: error
      - name: Create checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding utf8
          Copy-Item docs/ACCOUNT-TOOLS.md out/Windows-testing-guide.md
      - name: Publish requested release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Only a valid existing ZL-WA version tag may be published by this workflow.'
          }
          $files = Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty FullName
          gh release upload $env:RELEASE_TAG @files out/SHA256SUMS.txt out/Windows-testing-guide.md --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          if ($env:RELEASE_TAG.Contains('-')) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Publish standalone test download
        if: inputs.download_tag != '' || github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_TAG: ${{ inputs.download_tag || 'test-7.3.5-20261029-11' }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $env:DOWNLOAD_TAG.StartsWith("test-$version-")) { throw 'Test download must match the packaged version.' }
          $files = Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty FullName
          gh release create $env:DOWNLOAD_TAG @files out/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title "ZL-WA $version test-11 ZL-WA 设置更名测试包" --notes '独立测试包：设置中的开机启动、退出确认、恢复后重载、系统托盘、后台运行、待办等产品名称及相关提示改为ZL-WA，更新页底部显示ZL-WA is based on Franz，保留原有来源及许可证链接。仅修改显示文案，翻译键、配置项、开关绑定和功能逻辑保持原样。保留test-10的群发发送适配、错误暂停、同步等待及原会话诊断，以及此前语音、点赞等功能；真实发送故障根因仍需原会话诊断确认。正式版及自动更新不变。安装前请完全退出软件含托盘后覆盖安装。'
          if ($LASTEXITCODE -ne 0) { throw 'Test download upload failed.' }
