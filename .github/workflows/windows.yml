name: ZL-WA Windows

on:
  push:
    branches: ['test/7.3.7-20261105-1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Validate release version
        run: node -e "if (require('./package.json').version !== '7.3.7') throw Error('Version mismatch')"
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --frozen-lockfile
          pnpm package
      - name: Check types and tests
        shell: pwsh
        run: |
          pnpm typecheck *> typecheck.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content typecheck.log -Tail 100
            exit 1
          }
          pnpm test --runInBand --coverage=false *> tests.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content tests.log -Tail 150
            exit 1
          }
          Get-Content tests.log -Tail 8
      - name: Prepare the production NSIS compiler and plugins
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'zl-nsis'
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($item in @('nsis-3.0.4.1', 'nsis-resources-3.4.1')) {
            $file = Join-Path $root ($item + '.7z')
            Invoke-WebRequest -UseBasicParsing "https://github.com/electron-userland/electron-builder-binaries/releases/download/$item/$item.7z" -OutFile $file
            & 'C:\Program Files\7-Zip\7z.exe' x $file "-o$root\$item" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          }
          "ZL_NSIS_HOME=$root\nsis-3.0.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZL_NSIS_RESOURCES=$root\nsis-resources-3.4.1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify process isolation and installation from the old app directory
        shell: powershell
        run: |
          try {
            ./scripts/test-windows-installer.ps1 *>&1 | Tee-Object -FilePath installer-test.log
          } catch {
            $message = ($_ | Out-String).Trim()
            Write-Output ("::error::" + $message.Replace("`r", '').Replace("`n", '%0A'))
            throw
          } finally {
            if (Test-Path installer-test.log) {
              '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content installer-test.log | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - name: Build Windows x64
        run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-WA-Windows-x64
          path: out/*.exe
          if-no-files-found: error
      - name: Create checksums and publish test package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $expected = @('ZL-WA-win-AutoSetup-7.3.7-x64.exe', 'ZL-WA-win-Portable-7.3.7-x64.exe') | Sort-Object
          $actual = @(Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actual -join ',') -ne ($expected -join ',')) { throw 'Unexpected package set.' }
          $lines = Get-ChildItem out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding utf8
          $files = Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty FullName
          gh release create test-7.3.7-20261105-1 @files out/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title 'ZL-WA 7.3.7 test-1 (2026-11-05)' --notes-file docs/releases/7.3.7-test-1.md
          if ($LASTEXITCODE -ne 0) { throw 'Candidate upload failed.' }
