name: ZL-WA Windows

on:
  push:
    branches: ['release/7.3.6']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Validate release version
        run: node -e "if (require('./package.json').version !== '7.3.6') throw Error('Version mismatch')"
      - name: Install dependencies and Electron
        run: |
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --frozen-lockfile
          pnpm package
      - name: Check types and tests
        shell: pwsh
        run: |
          pnpm typecheck *> typecheck.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content typecheck.log -Tail 100
            exit 1
          }
          pnpm test --runInBand --coverage=false *> tests.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content tests.log -Tail 150
            exit 1
          }
          Get-Content tests.log -Tail 8
      - name: Build Windows x64
        run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: ZL-WA-Windows-x64
          path: out/*.exe
          if-no-files-found: error
      - name: Create checksums and publish verification candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $expected = @('ZL-WA-win-AutoSetup-7.3.6-x64.exe', 'ZL-WA-win-Portable-7.3.6-x64.exe') | Sort-Object
          $actual = @(Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actual -join ',') -ne ($expected -join ',')) { throw 'Unexpected package set.' }
          $lines = Get-ChildItem out -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content out/SHA256SUMS.txt -Encoding utf8
          $files = Get-ChildItem out -Filter *.exe | Select-Object -ExpandProperty FullName
          gh release create candidate-7.3.6-20261029 @files out/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --latest=false --title 'ZL-WA 7.3.6 verification candidate' --notes 'Based on test-12. Awaiting package verification; this candidate does not update the stable channel.'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate upload failed.' }
