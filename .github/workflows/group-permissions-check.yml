name: Group permissions compatibility regression
'on':
  push:
    branches:
    - fix/group-permissions-compat
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - uses: pnpm/action-setup@v4
    - name: Validate release version
      run: node -e "if (require('./package.json').version !== '7.3.9') throw Error('Version mismatch')"
    - name: Install dependencies and Electron
      run: |
        pnpm install --frozen-lockfile
        pnpm exec install-electron
    - name: Package service recipes
      working-directory: recipes
      run: |
        pnpm install --frozen-lockfile
        pnpm package
    - name: Check types and tests
      shell: pwsh
      run: |
        pnpm typecheck *> typecheck.log
        if ($LASTEXITCODE -ne 0) {
          Get-Content typecheck.log -Tail 100
          exit 1
        }
        pnpm test --runInBand --coverage=false *> tests.log
        if ($LASTEXITCODE -ne 0) {
          Get-Content tests.log -Tail 150
          exit 1
        }
        Get-Content tests.log -Tail 8
