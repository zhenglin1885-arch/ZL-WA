name: Publish verified ZL-WA 7.3.6

on:
  push:
    branches: ['publish/7.3.6-20261029']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: c474a0c42b81784609495a3e91d022582e1150d1
      EXPECTED_FILES: '{"ZL-WA-win-AutoSetup-7.3.6-x64.exe":"f8b2297d65c52bd35a0b47d997fdf596049bb292b5a42818a7cee20648154ec7","ZL-WA-win-Portable-7.3.6-x64.exe":"e548b538f43f060e77c2f007cd033dd47567e47e93f716acc352360aabb87058"}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify candidate source and download inspected packages
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/candidate-7.3.6-20261029" --jq '.object.sha')
          test "$actual" = "$SOURCE_SHA"
          test "$(node -p 'require("./package.json").version')" = '7.3.6'
          mkdir out
          gh release download candidate-7.3.6-20261029 --repo "$GITHUB_REPOSITORY" --dir out --pattern 'ZL-WA-win-*-7.3.6-x64.exe' --pattern SHA256SUMS.txt
          (cd out && sha256sum -c SHA256SUMS.txt)
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const expected = JSON.parse(process.env.EXPECTED_FILES);
          const actual = fs.readdirSync('out').sort();
          if (JSON.stringify(actual) !== JSON.stringify([...Object.keys(expected), 'SHA256SUMS.txt'].sort())) throw Error('Unexpected asset set');
          for (const [name, hash] of Object.entries(expected)) {
            const data = fs.readFileSync('out/' + name);
            if (data.length < 100000000 || data.toString('ascii', 0, 2) !== 'MZ' ||
                !data.subarray(data.readUInt32LE(0x3c), data.readUInt32LE(0x3c)+4).equals(Buffer.from('PE\0\0')) ||
                crypto.createHash('sha256').update(data).digest('hex') !== hash) throw Error('Unverified package: ' + name);
          }
          JS
      - name: Publish formal 7.3.6 update
        shell: bash
        run: |
          set -euo pipefail
          gh release create v7.3.6 out/*.exe out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'ZL-WA 7.3.6' --notes-file docs/RELEASE-7.3.6.md --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v7.3.6" --jq '.object.sha')" = "$SOURCE_SHA"
          gh release view v7.3.6 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'select(.tagName == "v7.3.6" and .isDraft == false and .isPrerelease == false)'
