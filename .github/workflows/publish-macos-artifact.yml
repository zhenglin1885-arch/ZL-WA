name: Publish verified macOS 7.3.8 artifacts
on:
  push:
    branches: ['publish/mac-7.3.8']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zl-macos-738-artifact-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '42510670197'
    steps:
      - name: Diagnose native-runner upload failure
        continue-on-error: true
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/128822842336/logs" > native-job.log
          python3 <<'PY'
          import pathlib,re
          text=pathlib.Path('native-job.log').read_text()
          lines=[l for l in text.splitlines() if any(x in l.lower() for x in ['error','mismatch','not found','http 4','http 5','permission denied','failed','shasum','immutable','release is'])]
          for l in lines[-12:]:print('::notice::'+l[:1200].replace('%','%25'))
          PY
      - name: Download and validate completed native builds
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" > artifacts.json
            if node -e 'const a=require("./artifacts.json").artifacts;process.exit(["ZL-WA-macOS-x64","ZL-WA-macOS-arm64"].every(n=>a.some(x=>x.name===n&&!x.expired))?0:1)'; then break; fi
            sleep 15
          done
          python3 <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('artifacts.json').read_text())['artifacts']
          names=[x['name'] for x in a if x['name'] in ['ZL-WA-macOS-x64','ZL-WA-macOS-arm64'] and not x['expired']]
          assert set(names)=={'ZL-WA-macOS-x64','ZL-WA-macOS-arm64'},'Both native builds must be available'
          pathlib.Path('artifact-names.txt').write_text('\n'.join(names)+'\n')
          PY
          mkdir -p packages
          while read -r name; do gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$name" --dir packages; done < artifact-names.txt
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v7.3.8" > tag.json
          python3 <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('packages');commit='55ebaa290611a45e56fc55b33492309bd2b899e8'
          tag=json.loads(pathlib.Path('tag.json').read_text());assert tag['object']['type']=='commit' and tag['object']['sha']==commit
          reports=list(root.glob('verification-*.json'));assert reports
          upload=[]
          for p in reports:
              v=json.loads(p.read_text());arch=v['arch'];s=v['startup'];assert v['commit']==commit and v['version']=='7.3.8' and v['signatureValid'] and v['zipDmgPayloadIdentical'] and s['nativePackagedStartup']
              assert s['version']=='7.3.8' and s['platform']=='darwin' and s['arch']==arch and s['localSessionReady'] and s['settingsLoaded'] and s['servicesLoaded'] and s['rootElements']>0 and not s['errorFallback']
              assert {f['name'] for f in v['files']}=={f'ZL-WA-macOS-7.3.8-{arch}.{ext}' for ext in ['dmg','zip']}
              checks=[]
              for f in v['files']:
                  q=root/f['name'];digest=hashlib.sha256(q.read_bytes()).hexdigest();assert q.stat().st_size==f['bytes'] and digest==f['sha256'];checks.append(f"{digest}  {q.name}");upload.append(q.name)
              proof=root/f'verification-macOS-7.3.8-{arch}.json';proof.write_text(json.dumps(v,indent=2)+'\n');upload.append(proof.name)
              sums=root/f'SHA256SUMS-macOS-7.3.8-{arch}.txt';sums.write_text('\n'.join(checks)+'\n');upload.append(sums.name)
          pathlib.Path('upload-files.txt').write_text('\n'.join(upload)+'\n')
          PY
      - name: Create independent stable Mac release from both verified builds
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib,json
          lines=['ZL-WA 7.3.8（macOS 正式版）','','- 支持 Intel 与 Apple 芯片（M 系列），提供 DMG 与 ZIP。','- 包含明亮纯色 ABCD 标记、聚合会话中的备注小弹窗，以及当前 7.3.8 正式版的既有功能和修复。','- Mac 与 Windows 使用相同的正式版源码（55ebaa2）。','','下载：']
          for arch,label in [('arm64','Apple 芯片（M 系列）'),('x64','Intel')]:
              p=pathlib.Path(f'packages/verification-macOS-7.3.8-{arch}.json');v=json.loads(p.read_text())
              lines.append(f'- [{label} DMG](https://github.com/zhenglin1885-arch/ZL-WA/releases/download/mac-v7.3.8/ZL-WA-macOS-7.3.8-{arch}.dmg)')
              assert v['startup']['nativePackagedStartup'] and v['signatureValid']
          lines+=['','两个架构均通过完整测试、DMG/ZIP 内容一致性校验、签名检查，以及从 /Applications 安装后的原生启动检查。']
          reports=[json.loads(p.read_text()) for p in pathlib.Path('packages').glob('verification-macOS-*.json')]
          if any(not v['notarized'] for v in reports):lines+=['','当前未经过 Apple 公证；临时签名（ad-hoc）的包首次打开可能被 macOS 安全机制拦截，可在“系统设置 → 隐私与安全性”中查看并允许打开。']
          pathlib.Path('mac-release-notes.md').write_text('\n'.join(lines)+'\n')
          PY
          files=()
          while read -r name; do files+=("packages/$name"); done < upload-files.txt
          if ! gh release create mac-v7.3.8 "${files[@]}" --repo "$GITHUB_REPOSITORY" --target 55ebaa290611a45e56fc55b33492309bd2b899e8 --latest=false --title 'ZL-WA 7.3.8 macOS' --notes-file mac-release-notes.md > publish.log 2>&1; then
            python3 <<'PY'
          import pathlib
          for line in pathlib.Path('publish.log').read_text().splitlines()[-20:]:print('::error::'+line[:1500].replace('%','%25'))
          PY
            exit 1
          fi
          cat publish.log
