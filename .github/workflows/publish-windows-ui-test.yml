name: Publish verified Windows UI test
on:
  push:
    branches: ['publish/windows-ui-2214e2e']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify source build
        run: |
          gh api repos/$GH_REPO/actions/runs/43657338159 > run.json
          gh api repos/$GH_REPO/actions/runs/43657338159/jobs > jobs.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json'))
          assert r['head_sha']=='2214e2e1981505b9daad1643a29cf9e89b539dfb'
          assert r['status']=='completed'
          jobs=json.load(open('jobs.json'))['jobs']
          assert len(jobs)==1
          steps={s['name']:s['conclusion'] for s in jobs[0]['steps']}
          for name in ['Check types and tests','Verify process isolation and installation from the old app directory','Build Windows x64','Verify packaged Windows startup and resume reload','Run actions/upload-artifact@v4']:
            assert steps[name]=='success', name
          assert [s['name'] for s in jobs[0]['steps'] if s['conclusion']=='failure']==['Create checksums and publish test release']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ZL-WA-Windows-x64
          run-id: 43657338159
          github-token: ${{ github.token }}
          path: out
      - name: Check packages and startup report
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('out')
          expected={
            'ZL-WA-win-AutoSetup-7.3.8-x64.exe':'f327bf4ba3922e02eec30416cf7c85aeda167a6c24e9b5988530d3603f630e79',
            'ZL-WA-win-Portable-7.3.8-x64.exe':'288393ee676019c13989b63da9b1d56a05ecfb9b7e605bcdb930ee6466254572',
          }
          assert {p.name for p in root.glob('*.exe')}==set(expected)
          for name,digest in expected.items():
            with (root/name).open('rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==digest,name
          r=json.loads((root/'windows-startup-verification.json').read_text(encoding='utf-8-sig'))
          assert r['commit']=='2214e2e1981505b9daad1643a29cf9e89b539dfb'
          assert r['nativePackagedStartup'] and r['mainProcessResumeReload']
          (root/'SHA256SUMS.txt').write_text(''.join(f'{v}  {k}\n' for k,v in expected.items()))
          PY
      - name: Publish independent prerelease
        run: |
          cat > notes.md <<'EOF'
          Windows x64 测试版，包含提交 2214e2e 的最新功能：
          - 分组鼠标拖动排序，重启后保留。
          - 客户标记上排 S 金色、A 红色；下排 B 蓝色、C 绿色、D 白色。
          - 聚合会话显示名称、可编辑红色备注、消息预览和所属账号。
          - 备注 Enter 或移开焦点保存，Esc 取消，与客户资料同步。
          - 聊天顶部保留联系人／群组名称。

          完整类型检查、自动测试、Windows 安装检查、打包启动及恢复验证已通过。发布前已核对构建提交、启动报告和文件 SHA256。
          EOF
          gh release create test-7.3.8-20261115-1 out/*.exe out/SHA256SUMS.txt out/windows-startup-verification.json --target 2214e2e1981505b9daad1643a29cf9e89b539dfb --prerelease --latest=false --title 'ZL-WA 7.3.8 Windows 界面功能测试版' --notes-file notes.md
