name: Finalize macOS Intel 7.3.7 release notes
on:
  push:
    branches: ['observe/mac-7.3.7']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published package set and record Apple Silicon build limitation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/mac-v7.3.7" > tag.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/mac-v7.3.7" > formal.json
          node <<'JS'
          const assert=require('node:assert/strict'),t=require('./tag.json'),r=require('./formal.json'),expected={"ZL-WA-macOS-7.3.7-x64.dmg": "abb2fdaf4b437208f53aa89144e8f62eb93a316ff2fe88fb9aa8784df21a6e6d", "ZL-WA-macOS-7.3.7-x64.zip": "e58a820bef9c53309cc017dff9a887e8ee453e5bb996e4ef68fa0a5784a5d428", "verification-x64.json": "6b2e49831d48011b717c078161940b6bb184cc0635fd7584689bc251a99c2cf2", "SHA256SUMS-macOS-7.3.7-x64.txt": "6403292e9ae2998ca9af88da61f4de0deb144c0ccfbffc223c8f9d6accad1520"};
          assert.equal(t.object.type,'commit');assert.equal(t.object.sha,'83d97793213ecd999d8c3867bc6be9b76b3b35cc');
          assert.equal(r.draft,false);assert.equal(r.prerelease,false);
          assert.deepEqual(r.assets.map(a=>a.name).sort(),Object.keys(expected).sort());
          for(const a of r.assets)if(a.digest)assert.equal(a.digest,'sha256:'+expected[a.name]);
          JS
          gh release edit mac-v7.3.7 --repo "$GITHUB_REPOSITORY" --title 'ZL-WA 7.3.7 for macOS (Intel)' --notes-file docs/releases/mac-7.3.7.md --latest=false
          echo '::notice::Verified Intel macOS 7.3.7 remains published. Apple Silicon native build is not available because hosted ARM runners could not be allocated.'
