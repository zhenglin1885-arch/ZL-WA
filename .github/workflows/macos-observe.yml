name: Inspect macOS startup failure
on:
  push:
    branches: ['observe/mac-7.3.7']
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read native startup failure log and alternate builder status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for run in 42045166936 42045324110; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > jobs.json
            node -e 'for(const j of require("./jobs.json").jobs)console.log(`::notice::${j.name}: ${j.status} ${j.conclusion||""}; ${j.steps?.filter(s=>s.status==="in_progress").map(s=>s.name).join(", ")||""}; job ${j.id}`)'
          done
