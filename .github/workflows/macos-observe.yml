name: Inspect macOS startup failure
on:
  push:
    branches: ['observe/mac-7.3.7']
permissions:
  actions: write
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read native startup failure log and alternate builder status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/42045324110/rerun-failed-jobs"
          echo '::notice::Retry requested for Apple Silicon dependency download after HTTP 504; application source unchanged.'
